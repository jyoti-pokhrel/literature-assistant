<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Research Agent AI</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/api.js"></script>
    <style>
        :root {
            --admin-radius: var(--radius-lg);
            --admin-gap: var(--s-3);
        }

        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            margin: 0;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* ----- Layout ----------------------------------------------------------- */
        .admin-wrapper { 
            display: flex; 
            min-height: 100vh;
            padding: var(--s-2);
            gap: var(--s-2);
        }

        .admin-sidebar {
            width: 280px;
            background: var(--glass-2);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--s-3);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: var(--s-2);
            height: calc(100vh - var(--s-4));
            box-shadow: var(--shadow-glass);
            z-index: 100;
        }

        .admin-logo {
            font-weight: 800; 
            font-size: 1.15rem; 
            margin-bottom: var(--s-4);
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
            color: var(--ink);
            padding-left: 0.5rem;
        }

        .nav-link {
            display: flex; 
            align-items: center; 
            gap: 0.75rem;
            padding: 0.85rem 1rem; 
            border-radius: var(--radius-md); 
            color: var(--ink-2);
            text-decoration: none; 
            transition: all var(--t-fast) var(--ease); 
            font-weight: 600;
            margin-bottom: 0.4rem; 
            border: 1px solid transparent; 
            background: transparent;
            width: 100%; 
            text-align: left; 
            cursor: pointer;
        }

        .nav-link:hover {
            background: var(--glass-border);
            color: var(--ink);
            transform: translateX(4px);
        }

        .nav-link.active {
            background: var(--ink);
            color: var(--bg) !important;
            box-shadow: var(--shadow-1);
        }

        .admin-content { 
            flex: 1; 
            display: flex;
            flex-direction: column;
            gap: var(--s-2);
        }

        .admin-navbar {
            height: 72px; 
            background: var(--glass-2);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 0 var(--s-4);
            box-shadow: var(--shadow-glass);
        }

        .admin-body { 
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: var(--s-3);
        }

        /* ----- Components ------------------------------------------------------- */
        .overview-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: var(--s-2);
        }

        .overview-card {
            background: var(--glass-strong);
            padding: 1.75rem;
            border-radius: var(--admin-radius); 
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
            transition: transform var(--t-fast) var(--ease-spring);
        }

        .overview-card:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .card-label { 
            font-size: 0.7rem; 
            color: var(--ink-2); 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        .card-value { 
            font-size: 2.25rem; 
            font-weight: 800; 
            margin: 0;
            color: var(--ink);
            letter-spacing: -0.02em;
        }
        .card-subtext { 
            font-size: 0.75rem; 
            color: var(--ink-3); 
            margin-top: 0.75rem;
            display: flex; 
            align-items: center; 
            gap: 0.35rem; 
        }

        .admin-card {
            background: var(--glass-2); 
            border-radius: var(--admin-radius);
            border: 1px solid var(--glass-border); 
            box-shadow: var(--shadow-glass);
            overflow: hidden;
        }

        .card-header {
            padding: 1.25rem 1.5rem; 
            border-bottom: 1px solid var(--rule);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .card-header h3 { 
            margin: 0; 
            font-size: 1rem; 
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .admin-table-container { 
            overflow-x: auto; 
        }
        .admin-table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        .admin-table th { 
            text-align: left; 
            padding: 1rem 1.5rem; 
            font-size: 0.7rem; 
            font-weight: 800; 
            color: var(--ink-2); 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--accent-soft); 
            border-bottom: 1px solid var(--rule); 
        }
        .admin-table td { 
            padding: 1.15rem 1.5rem; 
            border-bottom: 1px solid var(--rule); 
            font-size: 0.85rem; 
            color: var(--ink);
        }

        .status-pill { 
            padding: 0.35rem 0.85rem; 
            border-radius: 999px; 
            font-size: 0.7rem; 
            font-weight: 700; 
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .status-verified { background: var(--rule-strong); color: var(--ink); }
        .status-pending { background: var(--rule); color: var(--ink-2); }
        .status-banned { background: var(--ink); color: var(--bg); }

        /* ----- Buttons ---------------------------------------------------------- */
        .btn-action {
            background: transparent;
            border: 1px solid var(--rule-strong);
            color: var(--ink);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--t-fast) var(--ease);
        }

        .btn-action:hover {
            background: var(--ink);
            color: var(--bg);
            transform: translateY(-1px);
        }

        .btn-danger {
            border-color: var(--rule-strong);
            color: var(--ink-2);
        }

        .btn-danger:hover {
            background: var(--ink);
            color: var(--bg);
        }

        .dashboard-row { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: var(--s-2); 
        }
        @media (max-width: 1024px) { 
            .dashboard-row { grid-template-columns: 1fr; } 
        }

        [x-cloak] { display: none !important; }

        .reveal-view {
            animation: reveal-up 800ms var(--ease-out) forwards;
        }
    </style>
</head>
<body x-data="adminDashboard()" x-init="init()" :data-theme="theme">

    <div class="admin-wrapper">
        <aside class="admin-sidebar reveal">
            <div class="admin-logo" style="justify-content: center; padding-left: 0;">
                <span>Research Agent</span>
            </div>

            <nav style="flex: 1;">
                <button class="nav-link" :class="{ 'active': activeTab === 'overview' }" @click="activeTab = 'overview'">
                    <span>Overview</span>
                </button>
                <button class="nav-link" :class="{ 'active': activeTab === 'users' }" @click="activeTab = 'users'">
                    <span>Users</span>
                </button>
                <button class="nav-link" :class="{ 'active': activeTab === 'analytics' }" @click="activeTab = 'analytics'">
                    <span>Analytics</span>
                </button>
                <div style="margin: 1.5rem 0.5rem; height: 1px; background: var(--rule);"></div>
                <button class="nav-link" @click="window.location.href = '/'">
                    <span>Exit Admin</span>
                </button>
            </nav>

            <button class="nav-link" @click="signOut()" style="margin-top: auto; border: 1px solid var(--rule); justify-content: center;">
                <span>Sign Out</span>
            </button>
        </aside>

        <div class="admin-content">
            <header class="admin-navbar reveal reveal-d1">
                <div style="font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em;" x-text="getPageTitle()">Dashboard</div>
                <div style="display: flex; align-items: center; gap: 1.5rem;">
                    <button class="nav-link" @click="toggleTheme()" style="width: auto; padding: 0.5rem; margin: 0; border: none;">
                        <template x-if="theme === 'light'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></template>
                        <template x-if="theme === 'dark'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="18.36" x2="5.64" y2="16.92"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></template>
                    </button>
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div style="font-size: 0.85rem; font-weight: 700;" x-text="adminName">Admin User</div>
                    </div>
                </div>
            </header>

            <main class="admin-body">
                <!-- Status Row -->
                <div class="overview-grid reveal reveal-d2">
                    <div class="overview-card">
                        <div class="card-label">Total Users</div>
                        <div class="card-value" x-text="stats.users.total || '0'">0</div>
                        <div class="card-subtext"><span>+<span x-text="stats.users.new_last_24h || 0"></span> new today</span></div>
                    </div>
                    <div class="overview-card">
                        <div class="card-label">Total Searches</div>
                        <div class="card-value" x-text="stats.usage.total_searches || '0'">0</div>
                        <div class="card-subtext"><span><span x-text="stats.usage.searches_last_24h || 0"></span> in 24h</span></div>
                    </div>
                    <div class="overview-card">
                        <div class="card-label">Research Papers</div>
                        <div class="card-value" x-text="formatNumber(stats.usage.total_papers || 0)">0</div>
                        <div class="card-subtext"><span>Indexed from live sources</span></div>
                    </div>
                    <div class="overview-card">
                        <div class="card-label">System Health</div>
                        <div class="card-value" style="color: var(--ink);" x-text="stats.system.status === 'healthy' ? 'Healthy' : 'Issues'">Healthy</div>
                        <div class="card-subtext"><span>All systems operational</span></div>
                    </div>
                </div>

                <!-- Views -->
                <template x-if="activeTab === 'overview'">
                    <div x-cloak class="reveal-view">
                        <div class="dashboard-row">
                            <div class="admin-card">
                                <div class="card-header"><h3>Recent Users</h3><button class="btn-action" @click="activeTab = 'users'">View All</button></div>
                                <div class="admin-table-container">
                                    <table class="admin-table">
                                        <thead><tr><th>User</th><th>Role</th><th>Status</th></tr></thead>
                                        <tbody>
                                            <template x-for="user in users.slice(0, 5)" :key="user._id">
                                                <tr>
                                                    <td style="font-weight: 800;" x-text="user.username"></td>
                                                    <td style="text-transform: capitalize; font-weight: 600; opacity: 0.8;" x-text="user.role"></td>
                                                    <td><span class="status-pill" :class="getUserStatusClass(user)" x-text="getUserStatusLabel(user)"></span></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="admin-card">
                                <div class="card-header"><h3>System Status</h3></div>
                                <div style="padding: 1.5rem;">
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 1.25rem;"><span style="color: var(--ink-2); font-weight: 600; font-size: 0.85rem;">Database</span><span style="color: var(--ink); font-weight: 800; font-size: 0.85rem;">Connected</span></div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 1.25rem;"><span style="color: var(--ink-2); font-weight: 600; font-size: 0.85rem;">Latency</span><span style="font-weight: 800; font-size: 0.85rem;" x-text="stats.system.latency_ms + 'ms'"></span></div>
                                    <div style="margin-top: 1.75rem;">
                                        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: var(--ink-2);"><span>Storage</span><span>24%</span></div>
                                        <div style="width: 100%; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden;"><div style="width: 24%; height: 100%; background: var(--ink);"></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="admin-card" style="margin-top: var(--s-2);">
                            <div class="card-header"><h3>Search Activity</h3><button class="btn-action" @click="activeTab = 'analytics'">Full Analytics</button></div>
                            <div style="padding: 2rem; height: 350px; position: relative;">
                                <canvas id="overviewChart" x-init="$nextTick(() => initChart('overviewChart', 'main'))"></canvas>
                            </div>
                        </div>
                    </div>
                </template>

                <template x-if="activeTab === 'users'">
                    <div x-cloak class="admin-card reveal-view">
                        <div class="card-header"><h3>User Management</h3></div>
                        <div class="admin-table-container">
                            <table class="admin-table">
                                <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody>
                                    <template x-for="user in users" :key="user._id">
                                        <tr>
                                            <td style="font-weight: 800;" x-text="user.username"></td>
                                            <td style="opacity: 0.7;" x-text="user.email"></td>
                                            <td style="text-transform: capitalize; font-weight: 600;" x-text="user.role"></td>
                                            <td><span class="status-pill" :class="getUserStatusClass(user)" x-text="getUserStatusLabel(user)"></span></td>
                                            <td>
                                                <div style="display: flex; gap: 0.5rem;">
                                                    <template x-if="user.role !== 'admin'">
                                                        <button class="btn-action" @click="promoteToAdmin(user)">Promote</button>
                                                    </template>
                                                    <button class="btn-action btn-danger" @click="deleteUser(user)">Delete</button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <template x-if="activeTab === 'analytics'">
                    <div x-cloak class="reveal-view">
                        <div class="admin-card">
                            <div class="card-header"><h3>Search Volume (Last 7 Days)</h3></div>
                            <div style="padding: 2.5rem; height: 480px; position: relative;">
                                <canvas id="analyticsChartFull" x-init="$nextTick(() => setTimeout(() => initChart('analyticsChartFull', 'full'), 100))"></canvas>
                            </div>
                        </div>
                        <div class="dashboard-row" style="margin-top: var(--s-2);">
                            <div class="admin-card">
                                <div class="card-header"><h3>Most Searched Topics</h3></div>
                                <div class="admin-table-container">
                                    <table class="admin-table">
                                        <thead><tr><th>Topic</th><th>Search Count</th></tr></thead>
                                        <tbody>
                                            <template x-for="t in trending" :key="t._id">
                                                <tr><td style="font-weight: 800;" x-text="t._id"></td><td style="font-weight: 600; font-variant-numeric: tabular-nums;" x-text="t.count"></td></tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="admin-card">
                                <div class="card-header"><h3>Active Users</h3></div>
                                <div style="padding: 3rem 1.5rem; text-align: center;">
                                    <div style="font-size: 4rem; font-weight: 800; color: var(--ink); letter-spacing: -0.04em;" x-text="stats.users.total">0</div>
                                    <div style="color: var(--ink-2); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.5rem;">Total Users</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </main>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script>
        function adminDashboard() {
            return {
                activeTab: 'overview',
                theme: localStorage.getItem('theme') || 'light',
                adminName: localStorage.getItem('username') || 'Admin',
                stats: { users: {}, usage: {}, system: { status: 'healthy', latency_ms: 45 } },
                users: [],
                trending: [],
                charts: {},

                async init() {
                    if (!isLoggedIn()) { window.location.href = '/html/login.html'; return; }
                    document.documentElement.setAttribute('data-theme', this.theme);
                    await this.loadAll();
                },

                async loadAll() {
                    try {
                        const [s, u, t] = await Promise.all([
                            authenticatedFetch(`${BASE_URL}/admin/stats`),
                            authenticatedFetch(`${BASE_URL}/admin/users?limit=50`),
                            authenticatedFetch(`${BASE_URL}/admin/analytics/trending`)
                        ]);
                        if (s.ok) this.stats = await s.json();
                        if (u.ok) this.users = (await u.json()).users;
                        if (t.ok) this.trending = await t.json();
                    } catch (e) { console.error("Load failed", e); }
                },

                async initChart(id, key) {
                    const canvas = document.getElementById(id);
                    if (!canvas) return;
                    try {
                        const res = await authenticatedFetch(`${BASE_URL}/admin/analytics/searches`);
                        if (!res.ok) return;
                        const data = await res.json();
                        if (!data.length) return;

                        if (this.charts[key]) this.charts[key].destroy();
                        this.charts[key] = new Chart(canvas.getContext('2d'), {
                            type: 'line',
                            data: {
                                labels: data.map(d => d._id),
                                datasets: [{
                                    label: 'Searches',
                                    data: data.map(d => Number(d.count)),
                                    borderColor: '#000000',
                                    backgroundColor: 'rgba(0, 0, 0, 0.05)',
                                    borderWidth: 3,
                                    fill: true,
                                    tension: 0.1,
                                    pointRadius: 6,
                                    pointHoverRadius: 8,
                                    pointBackgroundColor: '#000000',
                                    pointBorderColor: '#fff',
                                    pointBorderWidth: 2
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.03)' }, ticks: { stepSize: 1, color: '#94a3b8' } },
                                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    } catch (e) { console.error("Chart failed", e); }
                },

                getUserStatusClass(u) { return u.is_active === false ? 'status-banned' : (u.is_verified ? 'status-verified' : 'status-pending'); },
                getUserStatusLabel(u) { return u.is_active === false ? 'Banned' : (u.is_verified ? 'Verified' : 'Pending'); },
                formatNumber(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : n; },
                getPageTitle() { return this.activeTab === 'overview' ? 'Overview' : (this.activeTab === 'users' ? 'Users' : 'Analytics'); },
                toggleTheme() { this.theme = this.theme === 'light' ? 'dark' : 'light'; localStorage.setItem('theme', this.theme); document.documentElement.setAttribute('data-theme', this.theme); },
                async promoteToAdmin(user) {
                    if (!confirm(`Are you sure you want to promote "${user.username}" to Admin? They will have full access to this dashboard.`)) {
                        return;
                    }

                    try {
                        const res = await authenticatedFetch(`${BASE_URL}/admin/users/${user.username}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ role: 'admin' })
                        });

                        if (res.ok) {
                            user.role = 'admin';
                            alert('User promoted successfully.');
                        } else {
                            const error = await res.json();
                            alert(`Failed to promote: ${error.detail || 'Unknown error'}`);
                        }
                    } catch (e) {
                        console.error("Promotion failed", e);
                        alert('An error occurred during promotion.');
                    }
                },

                async deleteUser(user) {
                    if (!confirm(`Are you sure you want to delete user "${user.username}"? This action cannot be undone.`)) {
                        return;
                    }

                    try {
                        const res = await authenticatedFetch(`${BASE_URL}/admin/users/${user.username}`, {
                            method: 'DELETE'
                        });

                        if (res.ok) {
                            this.users = this.users.filter(u => u.username !== user.username);
                            if (this.stats.users.total) {
                                this.stats.users.total--;
                            }
                            alert('User deleted successfully.');
                        } else {
                            const error = await res.json();
                            alert(`Failed to delete user: ${error.detail || 'Unknown error'}`);
                        }
                    } catch (e) {
                        console.error("Delete failed", e);
                        alert('An error occurred while trying to delete the user.');
                    }
                },

                signOut() { localStorage.removeItem('access_token'); window.location.href = '/html/login.html'; }
            }
        }
    </script>
</body>
</html>
