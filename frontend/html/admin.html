<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Research Agent</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="/js/alpine/alpine.min.js"></script>
    <script src="/js/api.js"></script>
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }
        .sidebar {
            padding: var(--s-4);
            border-right: 1px solid var(--rule);
        }
        .main-content {
            padding: var(--s-6);
            overflow-y: auto;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--s-4);
            margin-bottom: var(--s-6);
        }
        .stat-card {
            padding: var(--s-4);
            background: var(--glass-2);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            backdrop-filter: var(--glass-blur);
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--s-4);
        }
        .user-table th, .user-table td {
            padding: var(--s-3);
            text-align: left;
            border-bottom: 1px solid var(--rule);
        }
        .role-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .role-admin { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .role-user { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }
    </style>
</head>
<body x-data="adminDashboard()" x-init="init()">
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass">
            <div class="logo mb-6">
                <h1 class="t-h2">Research Agent</h1>
                <p class="t-xs opacity-50">Admin Panel</p>
            </div>
            <nav class="flex flex-col gap-2">
                <button @click="view = 'stats'" :class="view === 'stats' ? 'btn-primary' : 'btn-ghost'" class="w-full text-left justify-start">
                    Dashboard
                </button>
                <button @click="view = 'users'" :class="view === 'users' ? 'btn-primary' : 'btn-ghost'" class="w-full text-left justify-start">
                    User Management
                </button>
                <hr class="my-4 opacity-10">
                <button @click="signOut()" class="btn-ghost w-full text-left justify-start text-red-400">
                    Sign out
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="flex justify-between items-center mb-8">
                <h2 class="t-h1" x-text="view === 'stats' ? 'System Overview' : 'User Management'"></h2>
                <div class="flex items-center gap-3">
                    <span class="t-small opacity-60" x-text="'Welcome, ' + adminName"></span>
                    <div class="w-10 h-10 rounded-full bg-accent flex items-center justify-center text-white font-bold" x-text="adminName[0]"></div>
                </div>
            </header>

            <!-- Stats View -->
            <template x-if="view === 'stats'">
                <div>
                    <div class="stat-grid" x-show="stats">
                        <div class="stat-card">
                            <p class="t-xs opacity-50 uppercase tracking-wider">Total Users</p>
                            <h3 class="t-display mt-2" x-text="stats.users.total"></h3>
                            <p class="t-xs text-green-400 mt-2" x-text="'+' + stats.users.new_last_24h + ' in last 24h'"></p>
                        </div>
                        <div class="stat-card">
                            <p class="t-xs opacity-50 uppercase tracking-wider">Total Searches</p>
                            <h3 class="t-display mt-2" x-text="stats.usage.total_searches"></h3>
                            <p class="t-xs text-blue-400 mt-2" x-text="stats.usage.searches_last_24h + ' in last 24h'"></p>
                        </div>
                        <div class="stat-card">
                            <p class="t-xs opacity-50 uppercase tracking-wider">Gap Reports</p>
                            <h3 class="t-display mt-2" x-text="stats.usage.total_reports"></h3>
                        </div>
                        <div class="stat-card">
                            <p class="t-xs opacity-50 uppercase tracking-wider">System Status</p>
                            <h3 class="t-h2 mt-2 flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full bg-green-500"></span>
                                Healthy
                            </h3>
                        </div>
                    </div>

                    <div class="glass p-6 mt-8">
                        <h4 class="t-h2 mb-4">Quick Statistics</h4>
                        <div class="grid grid-cols-2 gap-8">
                            <div class="p-4 border border-rule rounded-lg">
                                <p class="t-small opacity-60">Verified Users</p>
                                <p class="t-h1" x-text="stats.users.verified"></p>
                            </div>
                            <div class="p-4 border border-rule rounded-lg">
                                <p class="t-small opacity-60">Google Auth Users</p>
                                <p class="t-h1" x-text="stats.users.google"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Users View -->
            <template x-if="view === 'users'">
                <div class="glass p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h4 class="t-h2">Registered Users</h4>
                        <input type="text" placeholder="Search users..." class="input-field max-w-xs">
                    </div>
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="user in users" :key="user._id">
                                <tr>
                                    <td x-text="user.username"></td>
                                    <td x-text="user.email"></td>
                                    <td>
                                        <span :class="user.role === 'admin' ? 'role-admin' : 'role-user'" class="role-badge" x-text="user.role"></span>
                                    </td>
                                    <td>
                                        <span :class="user.is_verified ? 'text-green-400' : 'text-yellow-400'" x-text="user.is_verified ? 'Verified' : 'Pending'"></span>
                                    </td>
                                    <td x-text="new Date(user.created_at).toLocaleDateString()"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <div x-show="loading" class="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center z-50">
                <div class="loading-spinner"></div>
            </div>
        </main>
    </div>

    <script>
        function adminDashboard() {
            return {
                view: 'stats',
                stats: null,
                users: [],
                loading: false,
                adminName: localStorage.getItem('username') || 'Admin',
                
                async init() {
                    if (!isLoggedIn()) {
                        window.location.href = '/html/login.html';
                        return;
                    }
                    await this.loadStats();
                    await this.loadUsers();
                },
                
                async loadStats() {
                    this.loading = true;
                    try {
                        const response = await fetch(`${BASE_URL}/admin/stats`, {
                            headers: getHeaders()
                        });
                        if (response.status === 403) {
                            alert('Access Denied: Admin only');
                            window.location.href = '/';
                            return;
                        }
                        this.stats = await response.json();
                    } catch (e) {
                        console.error('Failed to load stats', e);
                    } finally {
                        this.loading = false;
                    }
                },
                
                async loadUsers() {
                    this.loading = true;
                    try {
                        const response = await fetch(`${BASE_URL}/admin/users`, {
                            headers: getHeaders()
                        });
                        this.users = await response.json();
                    } catch (e) {
                        console.error('Failed to load users', e);
                    } finally {
                        this.loading = false;
                    }
                },
                
                signOut() {
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('username');
                    window.location.href = '/html/login.html';
                }
            }
        }
    </script>
</body>
</html>
