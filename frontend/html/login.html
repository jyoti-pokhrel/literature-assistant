<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Research Agent</title>
  <script>
    (function () {
      var storedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light');
      // Redirect already-authenticated users straight to their destination.
      var token = localStorage.getItem('access_token');
      if (token && token !== 'undefined' && token !== 'null') {
        var params = new URLSearchParams(window.location.search);
        var next = params.get('next') || '/workspace';
        if (typeof next !== 'string' || !next.startsWith('/') || next.startsWith('//')) {
          next = '/workspace';
        }
        window.location.replace(next);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <nav class="auth-nav">
    <a href="/index.html" class="auth-brand">Research Agent</a>
    <a href="signup.html" class="auth-nav-link">Create account →</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-kicker">Welcome back</span>
        <h1 class="auth-title">Log in</h1>
        <p class="auth-subtitle">Continue to your research workspace.</p>
      </div>

      <div id="session-expired-banner" class="auth-alert auth-success" style="display:none;">Your session expired — sign in to continue.</div>
      <div id="error-msg" class="auth-error"></div>

      <form id="login-form">
        <div class="auth-form-group">
          <label class="auth-label" for="username">Email or Username</label>
          <input class="auth-input" type="text" id="username" name="username" placeholder="Enter your email or username" required>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="password">Password</label>
          <div class="password-container">
            <input class="auth-input auth-input-password" type="password" id="password" name="password" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
              <svg id="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg id="eye-off-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.154 0 2.254.194 3.275.55M10.125 10.125a3 3 0 104.25 4.25"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

        <button type="submit" class="auth-button" id="submit-btn">Log In</button>
      </form>

      <div class="auth-divider">or</div>

      <a href="/auth/google" class="auth-google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>

      <div class="auth-links">
        Don't have an account? <a href="signup.html" class="auth-link">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    // Returns a safe same-origin path from ?next=, falling back to /workspace.
    function nextDestination() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      if (typeof next === 'string' && next.startsWith('/') && !next.startsWith('//')) {
        return next;
      }
      return '/workspace';
    }

    // Show the session-expired toast if the 401 interceptor flagged it.
    (function () {
      try {
        if (sessionStorage.getItem('auth:session-expired')) {
          sessionStorage.removeItem('auth:session-expired');
          window.addEventListener('DOMContentLoaded', function () {
            const banner = document.getElementById('session-expired-banner');
            if (banner) banner.style.display = 'block';
          });
        }
      } catch (_e) { /* private mode — ignore */ }
    })();

    // Handle OAuth Callback if redirected with token (legacy support — new flow
    // uses /html/oauth-callback.html, but we still accept #token here).
    window.onload = function() {
      // Password toggle logic
      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('password-toggle');
      const eyeIcon = document.getElementById('eye-icon');
      const eyeOffIcon = document.getElementById('eye-off-icon');

      if (passwordToggle) {
        passwordToggle.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          
          if (type === 'password') {
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
          } else {
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
          }
        });
      }

      // Token arrives in the URL fragment (#token=...&username=...) to keep it
      // out of browser history, Referer headers, and server access logs.
      const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
      const urlParams = new URLSearchParams(hash || window.location.search);
      const token = urlParams.get('token');
      const username = urlParams.get('username');
      
      if (token && username) {
        localStorage.setItem('access_token', token);
        localStorage.setItem('username', username);
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
        window.location.replace(nextDestination());
      }
    };

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submit-btn');

      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Logging in...';

      const formData = new URLSearchParams();
      formData.append('username', username);
      formData.append('password', password);

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Login failed');
        }

        // Save token and redirect
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('username', data.username);
        window.location.replace(nextDestination());

      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Log In';
      }
    });
  </script>
</body>
</html>
