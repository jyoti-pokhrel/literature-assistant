<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Research Agent</title>
  <script>
    (function () {
      var storedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <nav class="auth-nav">
    <a href="/index.html" class="auth-brand">Research Agent</a>
    <a href="login.html" class="auth-nav-link">Back to log in →</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-kicker">One more step</span>
        <h1 class="auth-title">Verify your email</h1>
        <p class="auth-subtitle">We sent a 6-digit code to <strong id="user-email-display">your email</strong>.</p>
      </div>

      <div id="alert-msg" class="auth-alert"></div>

      <form id="otp-form">
        <div class="auth-form-group">
          <input class="auth-input auth-input-otp" type="text" id="otp" name="otp" placeholder="000000" maxlength="6" pattern="\d{6}" title="6 digit code" required autocomplete="one-time-code">
        </div>

        <button type="submit" class="auth-button" id="submit-btn">Verify Account</button>
      </form>

      <button type="button" id="resend-btn" class="resend-link">Didn't receive code? Resend</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    
    if (email) {
      document.getElementById('user-email-display').innerText = email;
    } else {
      window.location.href = 'login.html';
    }

    const alertMsg = document.getElementById('alert-msg');

    function showAlert(message, isError = true) {
      alertMsg.innerText = message;
      alertMsg.className = isError ? 'auth-alert auth-error' : 'auth-alert auth-success';
      alertMsg.style.display = 'block';
    }

    document.getElementById('otp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const otp = document.getElementById('otp').value;
      const submitBtn = document.getElementById('submit-btn');

      alertMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Verifying...';

      try {
        const response = await fetch('/verify-otp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, otp })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Verification failed');
        }

        // Save token and redirect, honoring ?next= if it came through signup.
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('username', data.username);
        var nextParam = urlParams.get('next');
        var dest = (typeof nextParam === 'string' && nextParam.startsWith('/') && !nextParam.startsWith('//')) ? nextParam : '/workspace';
        window.location.replace(dest);


      } catch (err) {
        showAlert(err.message, true);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Verify Account';
      }
    });

    document.getElementById('resend-btn').addEventListener('click', async (e) => {
      const resendBtn = e.target;
      resendBtn.disabled = true;
      resendBtn.innerText = 'Sending...';
      alertMsg.style.display = 'none';

      try {
        const response = await fetch('/resend-otp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Failed to resend OTP');
        }

        showAlert('A new verification code has been sent.', false);
        
        let cooldown = 60;
        const interval = setInterval(() => {
          resendBtn.innerText = `Resend available in ${cooldown}s`;
          cooldown--;
          if (cooldown < 0) {
            clearInterval(interval);
            resendBtn.disabled = false;
            resendBtn.innerText = "Didn't receive code? Resend";
          }
        }, 1000);

      } catch (err) {
        showAlert(err.message, true);
        resendBtn.disabled = false;
        resendBtn.innerText = "Didn't receive code? Resend";
      }
    });
  </script>
</body>
</html>
