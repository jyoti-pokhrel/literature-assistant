<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Research Agent</title>
  <script>
    (function () {
      var storedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <nav class="auth-nav">
    <a href="/index.html" class="auth-brand">Research Agent</a>
    <a href="login.html" class="auth-nav-link">Log in →</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-kicker">Forgot password</span>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
      </div>

      <div id="alert-msg" class="auth-alert"></div>

      <form id="forgot-form">
        <div class="auth-form-group">
          <label class="auth-label" for="email">Email address</label>
          <input class="auth-input" type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <button type="submit" class="auth-button" id="submit-btn">Send Reset Link</button>
      </form>

      <a href="login.html" class="back-link">Back to log in</a>
    </div>
  </div>

  <script>
    const alertMsg = document.getElementById('alert-msg');

    function showAlert(message, isError = true) {
      alertMsg.innerText = message;
      alertMsg.className = isError ? 'auth-alert auth-error' : 'auth-alert auth-success';
      alertMsg.style.display = 'block';
    }

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const submitBtn = document.getElementById('submit-btn');

      alertMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';

      try {
        const response = await fetch('/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        // Always show success to prevent email enumeration, but backend already handles this
        showAlert(data.message || 'If an account exists, a reset link has been sent.', false);
        
        // Hide form fields after success
        document.getElementById('email').value = '';

      } catch (err) {
        showAlert('An error occurred. Please try again.', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
