<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - Research Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --auth-bg: #fdfdfd;
      --auth-card-bg: #ffffff;
      --auth-text: #000000;
      --auth-muted: #666666;
      --auth-border: #e2e2e2;
      --auth-input-bg: #ffffff;
      --auth-primary: #000000;
      --auth-primary-hover: #333333;
      --auth-focus: #000000;
    }
    
    [data-theme='dark'] {
      --auth-bg: #0a0a0c;
      --auth-card-bg: #111111;
      --auth-text: #ffffff;
      --auth-muted: #a1a1a1;
      --auth-border: #2a2a2a;
      --auth-input-bg: #0a0a0c;
      --auth-primary: #ffffff;
      --auth-primary-hover: #e0e0e0;
      --auth-focus: #ffffff;
    }

    body {
      background-color: var(--auth-bg);
      color: var(--auth-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .auth-nav {
      padding: 1.5rem 2.5rem;
      display: flex;
      align-items: center;
    }

    .auth-brand {
      font-weight: 700;
      font-size: 1.2rem;
      text-decoration: none;
      color: var(--auth-text);
      letter-spacing: -0.02em;
    }

    .auth-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .auth-card {
      background: var(--auth-card-bg);
      border: 1px solid var(--auth-border);
      border-radius: 12px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.03);
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .auth-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      color: var(--auth-muted);
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }

    .auth-form-group {
      margin-bottom: 1.5rem;
    }

    .auth-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .auth-input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--auth-border);
      border-radius: 8px;
      background: var(--auth-input-bg);
      color: var(--auth-text);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--auth-focus);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }
    
    [data-theme='dark'] .auth-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    .auth-button {
      width: 100%;
      padding: 0.85rem;
      background: var(--auth-primary);
      color: var(--auth-bg);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-button:hover {
      background: var(--auth-primary-hover);
    }

    .auth-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-alert {
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      display: none;
      border: 1px solid transparent;
    }

    .auth-error {
      background: #ffeeee;
      color: #cc0000;
      border-color: #ffcccc;
    }
    
    .auth-success {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }
    
    [data-theme='dark'] .auth-error {
      background: rgba(204, 0, 0, 0.1);
      border-color: rgba(204, 0, 0, 0.3);
      color: #ff6666;
    }

    [data-theme='dark'] .auth-success {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .password-container {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--auth-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
      z-index: 10;
    }

    .password-toggle:hover {
      color: var(--auth-text);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    .auth-input-password {
      padding-right: 45px !important;
    }

    /* Hide default browser password reveal icon */
    input::-ms-reveal,
    input::-ms-clear {
      display: none;
    }

  </style>

  <script>
    (function () {
      var storedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <nav class="auth-nav">
    <a href="/index.html" class="auth-brand">Research Agent</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Please enter your new password below.</p>
      </div>

      <div id="alert-msg" class="auth-alert"></div>

      <form id="reset-form">
        <div class="auth-form-group">
          <label class="auth-label" for="password">New Password</label>
          <div class="password-container">
            <input class="auth-input auth-input-password" type="password" id="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number" required minlength="8">
            <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password visibility">
              <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="eye-off-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.154 0 2.254.194 3.275.55M10.125 10.125a3 3 0 104.25 4.25"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="confirm_password">Confirm Password</label>
          <div class="password-container">
            <input class="auth-input auth-input-password" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required>
            <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Toggle password visibility">
              <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="eye-off-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.154 0 2.254.194 3.275.55M10.125 10.125a3 3 0 104.25 4.25"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-button" id="submit-btn">Reset Password</button>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    const alertMsg = document.getElementById('alert-msg');
    
    function showAlert(message, isError = true) {
      alertMsg.innerText = message;
      alertMsg.className = isError ? 'auth-alert auth-error' : 'auth-alert auth-success';
      alertMsg.style.display = 'block';
    }

    if (!token) {
      showAlert('Invalid or missing reset token.', true);
      document.getElementById('submit-btn').disabled = true;
    }

    // Password toggle logic
    document.querySelectorAll('.password-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const targetId = toggle.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const eyeIcon = toggle.querySelector('.eye-icon');
        const eyeOffIcon = toggle.querySelector('.eye-off-icon');
        
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        
        if (type === 'password') {
          eyeIcon.style.display = 'block';
          eyeOffIcon.style.display = 'none';
        } else {
          eyeIcon.style.display = 'none';
          eyeOffIcon.style.display = 'block';
        }
      });
    });


    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const submitBtn = document.getElementById('submit-btn');

      alertMsg.style.display = 'none';
      
      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Resetting...';

      try {
        const response = await fetch('/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token, new_password: password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Password reset failed');
        }

        // Save token and redirect
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('username', data.username);
        
        showAlert('Password reset successfully. Redirecting...', false);
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1500);

      } catch (err) {
        showAlert(err.message, true);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Reset Password';
      }
    });
  </script>
</body>
</html>
