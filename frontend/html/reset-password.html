<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Research Agent</title>
  <script>
    (function () {
      var storedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', storedTheme === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <nav class="auth-nav">
    <a href="/index.html" class="auth-brand">Research Agent</a>
    <a href="login.html" class="auth-nav-link">Log in →</a>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-kicker">Almost there</span>
        <h1 class="auth-title">Set a new password</h1>
        <p class="auth-subtitle">Choose something memorable — at least 8 characters.</p>
      </div>

      <div id="alert-msg" class="auth-alert"></div>

      <form id="reset-form">
        <div class="auth-form-group">
          <label class="auth-label" for="password">New Password</label>
          <div class="password-container">
            <input class="auth-input auth-input-password" type="password" id="password" name="password" placeholder="Min 8 chars, 1 uppercase, 1 number" required minlength="8">
            <button type="button" class="password-toggle" data-target="password" aria-label="Toggle password visibility">
              <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="eye-off-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.154 0 2.254.194 3.275.55M10.125 10.125a3 3 0 104.25 4.25"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="confirm_password">Confirm Password</label>
          <div class="password-container">
            <input class="auth-input auth-input-password" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required>
            <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Toggle password visibility">
              <svg class="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg class="eye-off-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064-7 9.542-7 1.154 0 2.254.194 3.275.55M10.125 10.125a3 3 0 104.25 4.25"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-button" id="submit-btn">Reset Password</button>
      </form>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    const alertMsg = document.getElementById('alert-msg');
    
    function showAlert(message, isError = true) {
      alertMsg.innerText = message;
      alertMsg.className = isError ? 'auth-alert auth-error' : 'auth-alert auth-success';
      alertMsg.style.display = 'block';
    }

    if (!token) {
      showAlert('Invalid or missing reset token.', true);
      document.getElementById('submit-btn').disabled = true;
    }

    // Password toggle logic
    document.querySelectorAll('.password-toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const targetId = toggle.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const eyeIcon = toggle.querySelector('.eye-icon');
        const eyeOffIcon = toggle.querySelector('.eye-off-icon');
        
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        
        if (type === 'password') {
          eyeIcon.style.display = 'block';
          eyeOffIcon.style.display = 'none';
        } else {
          eyeIcon.style.display = 'none';
          eyeOffIcon.style.display = 'block';
        }
      });
    });


    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const submitBtn = document.getElementById('submit-btn');

      alertMsg.style.display = 'none';
      
      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Resetting...';

      try {
        const response = await fetch('/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token, new_password: password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Password reset failed');
        }

        // Save token and redirect
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('username', data.username);
        
        showAlert('Password reset successfully. Redirecting...', false);
        var next = urlParams.get('next');
        if (typeof next !== 'string' || !next.startsWith('/') || next.startsWith('//')) {
          next = '/workspace';
        }
        setTimeout(function () { window.location.replace(next); }, 1200);

      } catch (err) {
        showAlert(err.message, true);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Reset Password';
      }
    });
  </script>
</body>
</html>
