# Local dev stack: FastAPI app + MongoDB.
# `docker compose up --build` boots the API on http://localhost:8000.
# Mongo is exposed on 27017 in case you want to point a GUI client at it.

services:
  app:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: research-agent:latest
    container_name: research-agent-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override MONGODB_URL so the app inside the network reaches Mongo
      # by service name, regardless of what .env points at.
      MONGODB_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-research_agent}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-1}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: research-agent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
